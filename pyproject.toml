[project]
name = "maid-validator-solidity"
version = "0.1.0"
description = "Solidity language validator plugin for MAID Runner, backed by tree-sitter-solidity."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mamerto Fabian Jr.", email = "mamerto@codefrost.com"}]
keywords = ["maid", "maid-runner", "solidity", "validator", "tree-sitter", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "maid-runner>=2.24,<3",
    "tomli>=2; python_version < '3.11'",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-solidity>=1.2.13,<2",
]

[project.urls]
Homepage = "https://github.com/mamertofabian/maid-validator-solidity"
Repository = "https://github.com/mamertofabian/maid-validator-solidity"
Issues = "https://github.com/mamertofabian/maid-validator-solidity/issues"
Changelog = "https://github.com/mamertofabian/maid-validator-solidity/blob/main/CHANGELOG.md"

[project.entry-points."maid_runner.validators"]
solidity = "maid_validator_solidity:SolidityValidator"

[dependency-groups]
dev = ["pytest>=8.4,<10", "black>=25", "ruff>=0.13"]

[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["maid_validator_solidity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
